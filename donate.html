<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support MacroSIP</title>
<meta name="description" content="Donate to MacroSIP development: BTC and USDT (TRC-20) with QR codes.">
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #1f883d; --accent-text: #ffffff; --chip: #eaeef2; --chip-on: #1f883d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --border: #30363d;
      --accent: #238636; --chip: #21262d; --chip-on: #238636;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  header { text-align: center; margin-bottom: 24px; }
  header img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 26px; margin: 12px 0 4px; }
  .lead { color: var(--muted); margin: 0; }
  .lang { position: absolute; top: 12px; right: 16px; font-size: 14px; }
  .lang a { color: var(--muted); text-decoration: none; margin-left: 8px; cursor: pointer; }
  .lang a.on { color: var(--text); font-weight: 600; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .amounts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .amounts button, .amounts input { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--chip); color: var(--text); font-size: 15px; cursor: pointer; }
  .amounts button.on { background: var(--chip-on); color: #fff; border-color: var(--chip-on); }
  .amounts input { width: 110px; cursor: text; }
  .qr { display: flex; justify-content: center; padding: 16px; background: #fff; border-radius: 8px; }
  .qr img, .qr canvas { display: block; }
  .sum { text-align: center; font-size: 18px; margin: 14px 0 4px; }
  .sum small { display: block; color: var(--muted); font-size: 13px; }
  .addr { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .addr code { flex: 1; font-size: 13px; word-break: break-all; background: var(--chip);
    padding: 8px 10px; border-radius: 6px; }
  .addr button { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; }
  .note { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .warn { color: #9a6700; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<nav class="lang"><a data-lang="en" class="on">English</a><a data-lang="ru">Русский</a></nav>
<main>
  <header>
    <img src="https://raw.githubusercontent.com/HSMM/MacroSIP/main/packaging/AppIcon-1024.png" alt="" onerror="this.style.display='none'">
    <h1 data-i18n="title">Support MacroSIP</h1>
    <p class="lead" data-i18n="lead">MacroSIP is free and open source. A donation helps keep it going.</p>
  </header>

  <div class="tabs" role="tablist">
    <button data-coin="btc" class="on">BTC · Bitcoin</button>
    <button data-coin="usdt">USDT · TRC-20</button>
  </div>

  <section class="card">
    <div class="amounts" id="amounts">
      <button data-usd="5">$5</button>
      <button data-usd="10" class="on">$10</button>
      <button data-usd="25">$25</button>
      <button data-usd="50">$50</button>
      <input id="custom" type="number" min="1" step="1" inputmode="numeric" placeholder="$ …" aria-label="Custom amount in USD">
    </div>
    <div class="qr"><div id="qr"></div></div>
    <div class="sum"><span id="sum"></span><small id="sumNote"></small></div>
    <div class="addr"><code id="addr"></code><button id="copy" data-i18n="copy">Copy</button></div>
    <p class="note" id="note"></p>
  </section>

  <footer><a href="https://github.com/HSMM/MacroSIP">github.com/HSMM/MacroSIP</a></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var WALLETS = {
    btc:  { address: "16GBSkVAY67ZbGdqxQE17vcZDiZdgn46Wf" },
    usdt: { address: "TX2hHPpUKXnhCvMb8PWkjSUbnvQ2wxCJr1" }
  };
  var I18N = {
    en: {
      title: "Support MacroSIP",
      lead: "MacroSIP is free and open source. A donation helps keep it going.",
      copy: "Copy", copied: "Copied",
      btcNote: "Scan with any Bitcoin wallet: the QR code contains the address and the amount.",
      btcRate: "≈ {btc} BTC at {rate} $/BTC",
      btcNoRate: "Live rate unavailable; the QR code contains the address only. Enter the amount in your wallet.",
      usdtNote: "Send USDT on the Tron network (TRC-20) only. Transfers on other networks will be lost.",
      usdtSum: "{usd} USDT",
      usdtRate: "The QR code contains the address; enter the amount in your wallet."
    },
    ru: {
      title: "Поддержать MacroSIP",
      lead: "MacroSIP бесплатен и открыт. Донат помогает развивать проект.",
      copy: "Копировать", copied: "Скопировано",
      btcNote: "Отсканируйте любым биткоин-кошельком: в QR-коде адрес и сумма.",
      btcRate: "≈ {btc} BTC по курсу {rate} $/BTC",
      btcNoRate: "Курс недоступен, в QR-коде только адрес. Сумму введите в кошельке.",
      usdtNote: "Отправляйте USDT только в сети Tron (TRC-20). Перевод в другой сети будет потерян.",
      usdtSum: "{usd} USDT",
      usdtRate: "В QR-коде адрес, сумму введите в кошельке."
    }
  };
  var q = new URLSearchParams(location.search).get("lang");
  var state = { lang: q === "ru" || q === "en" ? q : ((navigator.language || "en").slice(0, 2) === "ru" ? "ru" : "en"),
                coin: "btc", usd: 10, rate: null };
  var qr = new QRCode(document.getElementById("qr"),
    { width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });

  function t(key, vars) {
    var s = I18N[state.lang][key] || key;
    return s.replace(/\{(\w+)\}/g, function (_, k) { return vars && k in vars ? vars[k] : ""; });
  }
  function fmtBtc(v) { return v.toFixed(8).replace(/0+$/, "").replace(/\.$/, ".0"); }

  function render() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll(".lang a").forEach(function (a) { a.classList.toggle("on", a.dataset.lang === state.lang); });
    document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.coin === state.coin); });

    var w = WALLETS[state.coin], text, sum, sumNote, note;
    document.getElementById("addr").textContent = w.address;
    if (state.coin === "btc") {
      sum = "$" + state.usd;
      if (state.rate) {
        var btc = fmtBtc(state.usd / state.rate);
        text = "bitcoin:" + w.address + "?amount=" + btc + "&label=MacroSIP";
        sumNote = t("btcRate", { btc: btc, rate: Math.round(state.rate).toLocaleString(state.lang) });
      } else {
        text = "bitcoin:" + w.address + "?label=MacroSIP";
        sumNote = t("btcNoRate");
      }
      note = t("btcNote");
    } else {
      text = w.address;
      sum = t("usdtSum", { usd: state.usd });
      sumNote = t("usdtRate");
      note = t("usdtNote");
    }
    qr.clear(); qr.makeCode(text);
    document.getElementById("sum").textContent = sum;
    document.getElementById("sumNote").textContent = sumNote;
    var n = document.getElementById("note");
    n.textContent = note; n.classList.toggle("warn", state.coin === "usdt");
  }

  document.querySelector(".lang").addEventListener("click", function (e) {
    if (e.target.dataset.lang) { state.lang = e.target.dataset.lang; render(); }
  });
  document.querySelector(".tabs").addEventListener("click", function (e) {
    if (e.target.dataset.coin) { state.coin = e.target.dataset.coin; render(); }
  });
  var custom = document.getElementById("custom");
  document.getElementById("amounts").addEventListener("click", function (e) {
    if (!e.target.dataset.usd) return;
    state.usd = Number(e.target.dataset.usd); custom.value = "";
    document.querySelectorAll("#amounts button").forEach(function (b) { b.classList.toggle("on", b === e.target); });
    render();
  });
  custom.addEventListener("input", function () {
    var v = Math.floor(Number(custom.value));
    if (v >= 1) {
      state.usd = v;
      document.querySelectorAll("#amounts button").forEach(function (b) { b.classList.remove("on"); });
      render();
    }
  });
  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(WALLETS[state.coin].address).then(function () {
      btn.textContent = t("copied");
      setTimeout(function () { btn.textContent = t("copy"); }, 1500);
    });
  });

  render();
  fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")
    .then(function (r) { return r.json(); })
    .then(function (d) { state.rate = d.bitcoin.usd; render(); })
    .catch(function () {});
})();
</script>
</body>
</html>
